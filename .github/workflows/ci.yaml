name: Iris ML API - CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python on Runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # main.py loads the model from MLflow when it is imported,
      # so the server must be running and a model must be registered first
      - name: Start MLflow server
        run: |
          nohup mlflow server \
            --backend-store-uri sqlite:///mlflow.db \
            --host 127.0.0.1 --port 6001 > mlflow.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:6001/health && break
            sleep 2
          done

      - name: Train and register model
        run: python train.py

      - name: Run automated tests
        run: python -m pytest -v

      - name: Build Docker Image
        run: docker build -t iris-ml-api:${{ github.sha }} .